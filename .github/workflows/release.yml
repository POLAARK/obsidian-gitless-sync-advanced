name: Release plugin

on:
  # Manual trigger only. Releases are created explicitly so that a
  # locally built main.js can be attached when needed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example 1.0.0)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Build plugin
        run: |
          npm install -g pnpm@latest-11
          pnpm install
          pnpm build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" \
            --title="${{ inputs.tag }}" \
            main.js manifest.json styles.css

